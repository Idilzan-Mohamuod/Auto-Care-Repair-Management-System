<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-Care Repair Management System</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body>
    <main class="auth-layout">
      <div class="auth-container">
        <div class="auth-logo"><i class="fa-solid fa-car"></i> AutoCare</div>

        <!-- Sign In -->

        <form id="loginForm">
          <h1>Welcome Back</h1>

          <p class="auth-subtitle">Sign in to manage your vehicle service.</p>

          <label for="loginEmail">Email</label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
          />

          <label for="loginPassword">Password</label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
          />

          <p id="loginMessage" class="auth-message"></p>

          <button type="submit" class="btn">Sign In</button>

          <p class="auth-switch">
            Don't have an account?
            <a href="#" id="showSignup">Create Account</a>
          </p>
        </form>

        <!-- Sign Up -->

        <form id="signupForm" class="hidden">
          <h1>Create Account</h1>

          <p class="auth-subtitle">Create your AutoCare account.</p>

          <label for="signupName">Full Name</label>

          <input
            type="text"
            id="signupName"
            placeholder="Enter your full name"
            required
          />

          <label for="signupEmail">Email</label>

          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            required
          />

          <label for="signupPassword">Password</label>

          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            required
          />

          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
          />

          <p id="signupMessage" class="auth-message"></p>

          <button type="submit" class="btn">Create Account</button>

          <p class="auth-switch">
            Already have an account?
            <a href="#" id="showLogin">Sign In</a>
          </p>
        </form>
      </div>
    </main>
      <script src="js/NotificationAPI.js"></script>
    <script src="js/Auth.js"></script>
  </body>
</html>
